<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresar · TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
<main class="auth-stage"><section class="login-card" aria-labelledby="login-title">
    <div class="login-avatar" aria-hidden="true"><i class="bi bi-person"></i></div>
    <div class="login-card-inner">
        <a class="brand-mark login-brand" href="{{ url_for('login') }}"><span class="brand-icon"><i class="bi bi-check2"></i></span><span><span class="brand-name">TaskFlow</span><small>Gestión inteligente de tareas</small></span></a>
        <div class="login-heading"><span class="eyebrow light-text">Tu espacio de enfoque</span><h1 id="login-title">Bienvenido</h1><p>Ingresa para organizar tus pendientes.</p></div>
        {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="login-alert alert-{{ category }}" role="alert"><i class="bi bi-info-circle me-2"></i>{{ message }}</div>{% endfor %}{% endwith %}
        <form action="{{ url_for('login') }}" method="post"><div class="underline-field"><i class="bi bi-person"></i><label class="visually-hidden" for="username">Usuario</label><input id="username" name="username" autocomplete="username" required autofocus placeholder="Usuario"></div><div class="underline-field"><i class="bi bi-lock"></i><label class="visually-hidden" for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Contraseña"></div><button class="btn login-submit w-100" type="submit">INGRESAR <i class="bi bi-arrow-right ms-1"></i></button></form>
        <p class="login-backend"><span class="status-dot"></span>{{ backend_label }}</p>
    </div>
</section></main>
</body></html>
