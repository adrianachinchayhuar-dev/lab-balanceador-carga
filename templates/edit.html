<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Editar tarea · TaskFlow</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="app-page"><main class="container py-5"><div class="row justify-content-center"><div class="col-12 col-md-7 col-lg-5"><a class="brand-mark mb-5" href="{{ url_for('index') }}"><span class="brand-icon"><i class="bi bi-check2"></i></span><span><span class="brand-name">TaskFlow</span><small>Gestión inteligente de tareas</small></span></a><div class="card modal-card"><div class="card-body p-4 p-md-5"><span class="modal-kicker">Actualizar tarea</span><h1 class="h3 fw-bold mb-2">Editar tarea</h1><p class="text-secondary mb-4">Ajusta la descripción y guarda los cambios.</p><form action="{{ url_for('update', item_id=item_id) }}" method="post"><label for="tarea" class="form-label">Descripción</label><input id="tarea" name="tarea" value="{{ tarea }}" class="form-control form-control-lg mb-4" maxlength="200" required autofocus><div class="d-flex gap-2"><a href="{{ url_for('index') }}" class="btn btn-light flex-grow-1">Cancelar</a><button class="btn btn-primary flex-grow-1" type="submit"><i class="bi bi-check2 me-1"></i>Guardar cambios</button></div></form></div></div></div></div></main></body></html>
