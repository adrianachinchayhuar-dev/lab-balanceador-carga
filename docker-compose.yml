version: '3.8'

services:
  app1:
    build: .
    environment:
      - PORT=8081
  app2:
    build: .
    environment:
      - PORT=8082
  app3:
    build: .
    environment:
      - PORT=8083

  nginx_lb:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3